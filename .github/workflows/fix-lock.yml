name: Fix yarn lock
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack prepare yarn@4.9.2 --activate
      - run: yarn install
      - run: |
          git config user.name "fix-bot"
          git config user.email "fix@bot.com"
          git add yarn.lock
          git diff --cached --quiet || (git commit -m "fix: update yarn.lock" && git push)